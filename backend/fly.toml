# Fly.io config for the GridCoach backend.
#
#   cd backend
#   fly launch --copy-config --no-deploy     # creates the app; accept or change the name/region
#   fly volumes create gridcoach_data --size 1 --region <same region>
#   ../scripts/fly_secrets.sh                # pushes .env + service account as secrets
#   fly deploy
#
# One machine, always on: the job manager and pending confirmations live in process memory,
# and Strava webhooks need something listening 24/7. SQLite persists on the /data volume.

app = "gridcoach"          # must be globally unique on Fly — `fly launch` will prompt if taken
primary_region = "fra"     # pick the region nearest the athlete (Dubai → fra or bom)

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_PATH = "/data/gridcoach.db"
  PORT = "8080"
  # PUBLIC_BASE_URL is set by scripts/fly_secrets.sh to https://<app>.fly.dev

[mounts]
  source = "gridcoach_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # never scale to zero: in-flight jobs + webhooks
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1       # in-memory job state is per process

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"              # pandas sandbox forks a second interpreter; 512mb is tight
