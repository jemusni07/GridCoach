# fly.toml app configuration file generated for gridcoach on 2026-09-14T20:54:55+04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gridcoach'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_PATH = '/data/gridcoach.db'
  PORT = '8080'

[[mounts]]
  source = 'gridcoach_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1       # in-memory job state is per process

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'
